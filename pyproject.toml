# Projekti nimi, versioon ja toetatud Pythoni versioon.
[project]
name = "koolikompass"
version = "0.3.0"
description = "Kooliülesannete ja tähtaegade planeerija"
requires-python = ">=3.12"
# Django pakub veebiraamistiku; psycopg võimaldab PostgreSQL-i ühendust.
dependencies = ["Django>=5.2,<5.3", "psycopg[binary]>=3.2,<4"]

[tool.uv]
# Rakendus käivitatakse manage.py kaudu, seda ei paigaldata Pythoni teegina.
package = false
